name: PR
options:
  bundleIdPrefix: io.prstudio
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    GENERATE_INFOPLIST_FILE: 'YES'
    SUPPORTS_MACCATALYST: 'NO'
    ASSETCATALOG_COMPILER_APPICON_NAME: 'AppIcon'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: 'Automatic'
targets:
  PR:
    type: application
    platform: iOS
    sources:
      - path: PR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.prstudio.editor
        PRODUCT_NAME: PR
        INFOPLIST_KEY_CFBundleDisplayName: PR
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSSupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Выбор фотографий и видеоклипов для редактирования.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Сохранение результатов монтажа в медиатеку (при выборе такого действия).'
        INFOPLIST_KEY_UIFileSharingEnabled: 'YES'
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: 'YES'
    scheme:
      testTargets: []
